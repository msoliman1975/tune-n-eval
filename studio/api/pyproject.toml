[project]
name = "agritune-studio-api"
version = "0.1.0"
description = "AgriTune Studio API: the one door to the Data, Train and Eval services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
