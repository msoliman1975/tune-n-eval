[project]
name = "agritune-data"
version = "0.1.0"
description = "AgriTune Data service: turns mango sources into versioned, split datasets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "docling>=2.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "trafilatura>=2.0",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
