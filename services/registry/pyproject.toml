[project]
name = "agritune-registry"
version = "0.1.0"
description = "AgriTune Model Registry: base models, fine-tuned versions, Ollama and API models, with lineage and eval results"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agritune-core",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.0"]

[tool.uv.sources]
agritune-core = { path = "../../packages/core", editable = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
