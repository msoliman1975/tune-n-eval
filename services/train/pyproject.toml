[project]
name = "agritune-train"
version = "0.1.0"
description = "AgriTune Train service: fine-tunes small open models on the local GPU"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=3.17.2",
    "nvidia-ml-py>=13.0",
    "unsloth>=2026.10.8",
    "torch==2.13.0",
    "torchvision",
]

# Driver 577.13 supports CUDA up to 12.9; PyPI's default torch is built for CUDA 13.
# Pull torch from the cu129 index until the driver is updated.
[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
