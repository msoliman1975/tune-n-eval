[project]
name = "agritune-train"
version = "0.1.0"
description = "AgriTune Train service: fine-tunes small open models on the local GPU"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=3.17.2",
    "nvidia-ml-py>=13.0",
    "unsloth>=2026.10.8",
    "torch",
    "torchvision",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
